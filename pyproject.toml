[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quench-spectroscopy-qpu"
version = "0.1.0"
description = "Quench spectroscopy on a digital quantum computer (QPU)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "tqdm",
    "cmcrameri",
    "h5py",
    "physics-tenpy>=1.0.6",
    "pylatexenc",
    "qiskit>=2.5.1",
    "qiskit-aer>=0.17.2",
    "qiskit-ibm-runtime>=0.49.0",
    "seaborn",
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "ty",
]
# Extra dependencies required only by scripts/run_quench.py
run = [
    "mps-to-circuit@git+https://github.com/qiskit-community/mps-to-circuit",
    "qiskit-addon-aqc-tensor@git+https://github.com/Qiskit/qiskit-addon-aqc-tensor.git",
    "qiskit_qasm3_import",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["spectroscopy*"]

[tool.ruff]
line-length = 100
